<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CreativeCheck Profile</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{font-family:'Plus Jakarta Sans',Arial,sans-serif;color:#10213f;background:#f7f8fb}.page{min-height:100vh;padding:28px 18px 55px;background:linear-gradient(180deg,#f7f8fb,#fff 65%)}.shell{max-width:980px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:65px}.brand{font-weight:900;letter-spacing:.08em;text-decoration:none;color:#10213f}.discover{color:#10213f;text-decoration:none;font-size:13px}.card{background:#fff;border:1px solid #e7eaf0;padding:62px;border-radius:4px;box-shadow:0 18px 50px rgba(16,33,63,.07)}.avatar{width:116px;height:116px;border-radius:50%;overflow:hidden;background:#e9eef5;display:grid;place-items:center;margin-bottom:28px}.avatar img{width:100%;height:100%;object-fit:cover}.avatar span{font-size:42px;font-weight:800}.kicker{font-size:10px;font-weight:800;letter-spacing:.15em;color:#60708b}.card h1{font-size:clamp(40px,6vw,76px);line-height:.95;margin:10px 0 14px;letter-spacing:-.045em}.role{font-size:20px;margin:0 0 5px}.loc{color:#60708b;margin:0}.verified{display:inline-block;margin-top:18px;padding:7px 10px;border:1px solid #dce3ec;font-size:10px;letter-spacing:.12em;font-weight:800}.bio{max-width:720px;font-size:18px;line-height:1.7;margin:40px 0 0;color:#394963}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:32px}.links a,.upgrade a{padding:12px 17px;border:1px solid #10213f;color:#10213f;text-decoration:none;font-weight:700;font-size:13px}.upgrade{margin-top:26px;padding:32px 36px;background:#10213f;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:25px}.upgrade h2{font-size:27px;margin:6px 0}.upgrade p{max-width:620px;color:#dbe3ef;line-height:1.6;margin:0}.upgrade a{border-color:#fff;color:#fff;white-space:nowrap}.muted{color:#60708b}.foot{text-align:center;padding-top:42px;color:#60708b;font-size:11px;letter-spacing:.12em}@media(max-width:700px){.page{padding:20px 15px 40px}.head{margin-bottom:40px}.card{padding:34px 23px}.card h1{font-size:44px}.upgrade{display:block;padding:26px 23px}.upgrade a{display:inline-block;margin-top:20px}}
</style></head><body><main class="page"><div class="shell"><header class="head"><a class="brand" href="/">CREATIVECHECK</a><a class="discover" href="/">Discover creatives →</a></header><section id="app"></section><footer class="foot">DISCOVER · CONNECT · GROW</footer></div></main><script>
const U='https://gnqrakuhmzchwherombt.supabase.co',K='sb_publishable_-sTc8wYEmrNKb-gtHc_qHA_cxq9M5lS';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=(location.pathname.match(/-(\d+)\/?$/)||[])[1]||new URLSearchParams(location.search).get('id');
const app=document.getElementById('app');
if(!id){app.innerHTML='<div class="card"><h1>Profile unavailable</h1><p class="muted">No CreativeCheck profile was specified.</p></div>'}
else fetch(U+'/rest/v1/profiles?id=eq.'+encodeURIComponent(id)+'&status=eq.approved&select=id,full_name,profession,category,city,country,website,instagram,portfolio_url,bio,profile_type,verified',{headers:{apikey:K,Authorization:'Bearer '+K}})
.then(r=>r.json()).then(rows=>{const p=rows[0];if(!p)throw Error('Profile not found');const links=[['Website',p.website],['Portfolio',p.portfolio_url],['Instagram',p.instagram]].filter(x=>x[1]);app.innerHTML='<section class="card"><div class="kicker">'+(p.profile_type==='business'?'CREATIVE BUSINESS':'CREATIVE PROFESSIONAL')+'</div><h1>'+esc(p.full_name||'Creative professional')+'</h1>'+(p.profession?'<p class="role">'+esc(p.profession)+'</p>':'')+((p.city||p.country)?'<p class="loc">'+esc([p.city,p.country].filter(Boolean).join(', '))+'</p>':'')+(p.verified?'<span class="verified">VERIFIED PROFILE</span>':'')+(p.bio?'<p class="bio">'+esc(p.bio)+'</p>':'')+(links.length?'<div class="links">'+links.map(x=>'<a href="'+esc(x[1])+'" target="_blank" rel="noreferrer">'+x[0]+' ↗</a>').join('')+'</div>':'')+'</section><section class="upgrade"><div><div class="kicker" style="color:#b9c7db">CREATIVECHECK</div><h2>Want more from your profile?</h2><p>Upgrade when you are ready for increased visibility, professional connections and more ways to grow on CreativeCheck.</p></div><a href="/#membership">Upgrade to Premium →</a></section>'})
.catch(e=>{app.innerHTML='<div class="card"><h1>Profile unavailable</h1><p class="muted">'+esc(e.message)+'</p><a href="/">Back to CreativeCheck</a></div>'});
</script></body></html>
